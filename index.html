 <!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEA | Live Vehicle Tracking - งานประชุม ผจก.</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --bg:#0B0D14; --panel:#12141F; --card:#181B29; --line:#242838;
    --purple:#7C4DFF; --purple-soft:rgba(124,77,255,.15);
    --green:#3DDC84; --amber:#F5A623; --red:#FF5C5C;
    --text:#EDEFF7; --sub:#7C8299;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);height:100vh;overflow:hidden}
  .app{display:grid;grid-template-columns:340px 1fr;height:100vh}
  aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
  aside header{padding:20px 20px 14px;border-bottom:1px solid var(--line)}
  .brand{font-size:11px;letter-spacing:.16em;color:var(--purple);text-transform:uppercase;font-weight:700}
  aside h1{margin:6px 0 2px;font-size:19px;font-weight:700;letter-spacing:-.01em}
  .subtitle{font-size:12px;color:var(--sub)}
  .stats{display:flex;gap:8px;padding:14px 20px;border-bottom:1px solid var(--line)}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .stat .n{font-family:var(--mono);font-size:20px;font-weight:700}
  .stat .l{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
  .stat.on .n{color:var(--green)} .stat.stale .n{color:var(--amber)} .stat.off .n{color:var(--sub)}
  .search{padding:12px 20px}
  .search input{width:100%;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--text);font-size:13px}
  .vehicle-list{flex:1;overflow-y:auto;padding:0 12px 12px}
  .vcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:6px 8px;cursor:pointer;transition:border-color .15s}
  .vcard:hover{border-color:var(--purple)}
  .vcard.selected{border-color:var(--purple);background:var(--purple-soft)}
  .vcard-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .vname{font-weight:700;font-size:13.5px}
  .vid{font-family:var(--mono);font-size:10.5px;color:var(--sub)}
  .badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
  .badge.on{background:rgba(61,220,132,.15);color:var(--green)}
  .badge.stale{background:rgba(245,166,35,.15);color:var(--amber)}
  .badge.off{background:rgba(124,130,153,.15);color:var(--sub)}
  .vmeta{display:flex;gap:14px;margin-top:8px;font-size:11.5px;color:var(--sub);font-family:var(--mono)}
  .empty{padding:40px 20px;text-align:center;color:var(--sub);font-size:13px;line-height:1.7}
  main{position:relative}
  #map{height:100vh;width:100%;background:#0B0D14}
  .topbar{position:absolute;top:16px;right:16px;z-index:1000;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--sub)}
  .live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,132,.5)}70%{box-shadow:0 0 0 8px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}
  .leaflet-popup-content-wrapper{background:var(--card);color:var(--text);border-radius:10px}
  .leaflet-popup-tip{background:var(--card)}
  .popup-title{font-weight:700;font-size:13px;margin-bottom:4px}
  .popup-row{font-family:var(--mono);font-size:11px;color:var(--sub)}
  ::-webkit-scrollbar{width:6px} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
</style>
</head>
<body>
<div class="app">
  <aside>
    <header>
      <div class="brand">PEA · กฟส.อ่าวลึก</div>
      <h1>Live Vehicle Tracking</h1>
      <div class="subtitle">ติดตามยานพาหนะแบบเรียลไทม์</div>
    </header>
    <div class="stats">
      <div class="stat on"><div class="n" id="cntOn">0</div><div class="l">Online</div></div>
      <div class="stat stale"><div class="n" id="cntStale">0</div><div class="l">Idle</div></div>
      <div class="stat off"><div class="n" id="cntOff">0</div><div class="l">Offline</div></div>
    </div>
    <div class="search"><input id="searchBox" placeholder="ค้นหารถ / คนขับ..."></div>
    <div class="vehicle-list" id="vehicleList">
      <div class="empty">กำลังโหลดข้อมูล...</div>
    </div>
  </aside>
  <main>
    <div id="map"></div>
    <div class="topbar"><span class="live-dot"></span><span id="topbarText">อัปเดตทุก 5 วินาที</span></div>
  </main>
</div>

<script>
// ⚠️ CONFIG - แก้ URL ให้ตรงกับ Apps Script deployment ของคุณ
const GAS_URL = 'https://script.google.com/macros/s/AKfycbytt3h9GVgqqQbuOwrxJGQTOn5pe-fKOOW7H_t6wNWlHCbYGZVY8YtIE-Mcj4kVbkcx/exec';
const POLL_MS = 8000;
const CENTER = [8.2733, 98.8324]; // อ่าวลึก, กระบี่

const map = L.map('map', { zoomControl: true }).setView(CENTER, 12);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19
}).addTo(map);

// ปุ่มไปตำแหน่งปัจจุบัน
const LocateControl = L.Control.extend({
  options: { position: 'bottomright' },
  onAdd: function(){
    const btn = L.DomUtil.create('button', '');
    btn.innerHTML = '📍';
    btn.title = 'ตำแหน่งปัจจุบันของฉัน';
    btn.style.cssText = 'width:38px;height:38px;background:var(--panel);border:1px solid var(--line);border-radius:10px;font-size:18px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.3)';
    L.DomEvent.disableClickPropagation(btn);
    btn.onclick = ()=>{
      if(!navigator.geolocation){ alert('อุปกรณ์นี้ไม่รองรับ GPS'); return; }
      btn.innerHTML = '⏳';
      navigator.geolocation.getCurrentPosition(pos=>{
        map.setView([pos.coords.latitude, pos.coords.longitude], 15, { animate:true });
        L.circleMarker([pos.coords.latitude, pos.coords.longitude], { radius:8, color:'#7C4DFF', fillColor:'#7C4DFF', fillOpacity:.8 }).addTo(map);
        btn.innerHTML = '📍';
      }, ()=>{ alert('หาตำแหน่งไม่สำเร็จ กรุณาอนุญาต location'); btn.innerHTML = '📍'; }, { enableHighAccuracy:true, timeout:10000 });
    };
    return btn;
  }
});
map.addControl(new LocateControl());

const markers = {}; // vehicleId -> L.Marker
let selectedId = null;
let currentData = [];

// เกณฑ์สถานะ: OFFLINE จะเกิดเฉพาะตอนคนขับกดหยุด/ปิดแอปจริงๆ (ส่งสัญญาณ stop มาชัดเจน)
// ส่วน ONLINE/IDLE คำนวณจากเวลาระหว่างจุดรับส่งที่อาจไกลกัน จึงให้ IDLE ค้างได้นานโดยไม่ตัดเป็น OFFLINE เอง
const ONLINE_MAX_MIN = 1.5;      // ส่งมาไม่เกิน 1.5 นาที = ONLINE
const SAFETY_OFFLINE_MIN = 30;   // เผื่อแอปปิดไปโดยไม่ได้กดหยุด (เช่น แบตหมด) นานเกิน 30 นาทีค่อยถือว่า OFFLINE

function statusOf(v){
  if (v.trackingStatus === 'stopped') return 'off';
  const diffMin = (Date.now() - new Date(v.lastUpdate).getTime()) / 60000;
  if (diffMin > SAFETY_OFFLINE_MIN) return 'off';
  if (diffMin < ONLINE_MAX_MIN) return 'on';
  return 'stale';
}
function statusColor(s){ return s==='on' ? '#3DDC84' : s==='stale' ? '#F5A623' : '#7C8299'; }
function statusText(s){ return s==='on' ? 'Online' : s==='stale' ? 'Idle' : 'Offline'; }
function timeAgo(iso){
  const diffSec = Math.round((Date.now() - new Date(iso).getTime())/1000);
  if (diffSec < 60) return `${diffSec} วิ ที่แล้ว`;
  if (diffSec < 3600) return `${Math.round(diffSec/60)} นาทีที่แล้ว`;
  return `${Math.round(diffSec/3600)} ชม.ที่แล้ว`;
}

function vehicleIcon(color, heading, plateLabel, subLabel){
  const rot = heading != null ? heading : 0;
  return L.divIcon({
    className: '',
    html: `<div style="display:flex;flex-direction:column;align-items:center;transform:translateY(-4px)">
             <div style="width:26px;height:26px;border-radius:50%;background:${color};display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px ${color}33,0 2px 6px rgba(0,0,0,.5);transform:rotate(${rot}deg)">
               <svg width="13" height="13" viewBox="0 0 24 24" fill="#0B0D14"><path d="M12 2 L20 20 L12 16 L4 20 Z"/></svg>
             </div>
             <div style="margin-top:3px;background:#12141F;color:#EDEFF7;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px 6px 0 0;border:1px solid ${color};border-bottom:none;white-space:nowrap;box-shadow:0 2px 4px rgba(0,0,0,.4)">${plateLabel}</div>
             <div style="background:#1E2230;color:#8A90A6;font-family:'IBM Plex Sans',sans-serif;font-size:9.5px;font-weight:600;padding:1px 7px 2px;border-radius:0 0 6px 6px;border:1px solid ${color};border-top:none;white-space:nowrap;box-shadow:0 2px 4px rgba(0,0,0,.4)">${subLabel}</div>
           </div>`,
    iconSize: [26,58], iconAnchor: [13,17]
  });
}

function upsertMarker(v){
  const s = statusOf(v);
  if (s === 'off') {
    // ไม่แสดงหมุดของรถที่ OFFLINE บนแผนที่ — ถ้าเคยมีหมุดอยู่ก่อน ให้เอาออก
    if (markers[v.vehicleId]) { map.removeLayer(markers[v.vehicleId]); delete markers[v.vehicleId]; }
    return;
  }
  const color = statusColor(s);
  const paxLabel = v.passengerCount!=null ? (v.seatCapacity ? `${v.passengerCount}/${v.seatCapacity} ที่นั่ง` : `${v.passengerCount} คน`) : '-';
  const subLabel = `${v.driverName || 'ไม่ระบุคนขับ'} / ${paxLabel}`;
  const icon = vehicleIcon(color, v.heading, v.licensePlate || v.vehicleId, subLabel);
  const popupHtml = `<div class="popup-title">${v.licensePlate || v.vehicleId}</div>
    <div class="popup-row">คนขับ: ${v.driverName || '-'}</div>
    <div class="popup-row">ผู้โดยสาร: ${paxLabel}</div>
    <div class="popup-row">ความเร็ว: ${v.speed!=null ? v.speed.toFixed(0)+' กม./ชม.' : '-'}</div>
    <div class="popup-row">อัปเดต: ${timeAgo(v.lastUpdate)}</div>
    <div class="popup-row" style="display:flex;gap:14px;margin-top:6px">
      ${v.driverPhone ? `<a href="tel:${v.driverPhone}" style="color:var(--purple);font-weight:700">📞 โทร</a>` : ''}
      ${v.driverLineUserId ? `<a href="#" onclick="event.preventDefault();quickLineMessage('${v.driverLineUserId}','${(v.driverName||v.licensePlate).replace(/'/g,"")}')" style="color:var(--green);font-weight:700">💬 LINE</a>` : ''}
    </div>`;
  if (markers[v.vehicleId]) {
    markers[v.vehicleId].setLatLng([v.lat, v.lng]).setIcon(icon).setPopupContent(popupHtml);
  } else {
    markers[v.vehicleId] = L.marker([v.lat, v.lng], { icon }).addTo(map).bindPopup(popupHtml);
  }
}

function render(data){
  currentData = data;
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  let on=0, stale=0, off=0;
  const listEl = document.getElementById('vehicleList');
  listEl.innerHTML = '';

  if (!data.length){
    listEl.innerHTML = '<div class="empty">ยังไม่มีข้อมูลรถ<br>ให้คนขับเปิดหน้า driver.html แล้วกดเริ่มติดตาม</div>';
  }

  data
    .filter(v => !q || (v.licensePlate||'').toLowerCase().includes(q) || (v.driverName||'').toLowerCase().includes(q) || v.vehicleId.toLowerCase().includes(q))
    .sort((a,b)=> statusOf(a)==='off' ? 1 : -1)
    .forEach(v=>{
      const s = statusOf(v);
      if(s==='on') on++; else if(s==='stale') stale++; else off++;
      upsertMarker(v);

      const paxLabel = v.passengerCount!=null ? (v.seatCapacity ? `${v.passengerCount}/${v.seatCapacity} คน` : `${v.passengerCount} คน`) : '- คน';
      const card = document.createElement('div');
      card.className = 'vcard' + (selectedId===v.vehicleId ? ' selected' : '');
      card.innerHTML = `
        <div class="vcard-top">
          <div><div class="vname">${v.licensePlate || v.vehicleId}</div><div class="vid">${v.vehicleId}</div></div>
          <span class="badge ${s}">${statusText(s)}</span>
        </div>
        <div class="vmeta">
          <span>${v.driverName || 'ไม่ระบุคนขับ'}</span>
          <span>${paxLabel}</span>
          <span>${timeAgo(v.lastUpdate)}</span>
          ${v.driverPhone ? `<a href="tel:${v.driverPhone}" onclick="event.stopPropagation()" style="color:var(--purple);font-weight:700">📞</a>` : ''}
          ${v.driverLineUserId ? `<a href="#" onclick="event.stopPropagation();event.preventDefault();quickLineMessage('${v.driverLineUserId}','${(v.driverName||v.licensePlate).replace(/'/g,"")}')" style="color:var(--green);font-weight:700">💬</a>` : ''}
        </div>`;
      card.addEventListener('click', ()=>{
        selectedId = v.vehicleId;
        map.setView([v.lat, v.lng], 15, { animate:true });
        markers[v.vehicleId].openPopup();
        render(currentData);
      });
      listEl.appendChild(card);
    });

  document.getElementById('cntOn').textContent = on;
  document.getElementById('cntStale').textContent = stale;
  document.getElementById('cntOff').textContent = off;
}

async function quickLineMessage(userId, name){
  const msg = prompt(`ส่งข้อความ LINE ถึง ${name}:`, 'กรุณาติดต่อกลับด่วนครับ');
  if(!msg) return;
  try{
    const res = await fetch(GAS_URL, {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ type:'broadcast', message: msg, target:[userId] })
    });
    const data = await res.json();
    alert(data.ok ? 'ส่งข้อความสำเร็จ' : 'ส่งไม่สำเร็จ: '+data.error);
  }catch(err){
    alert('เกิดข้อผิดพลาด: '+err);
  }
}

let consecutiveFailures = 0;

async function poll(){
  try{
    const res = await fetch(`${GAS_URL}?action=positions`);
    const data = await res.json();
    render(data);
    consecutiveFailures = 0;
    document.getElementById('topbarText').textContent = 'อัปเดตทุก ' + (POLL_MS/1000) + ' วินาที';
  }catch(err){
    consecutiveFailures++;
    // แสดง error เฉพาะเมื่อพลาดติดต่อกันหลายครั้ง กันข้อความกระพริบสลับไปมาจากการสะดุดครั้งเดียว
    if (consecutiveFailures >= 2) {
      document.getElementById('topbarText').textContent = 'เชื่อมต่อไม่สำเร็จ กำลังลองใหม่...';
    }
  }
}

document.getElementById('searchBox').addEventListener('input', ()=> render(currentData));
poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
