<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ลงทะเบียนคนขับ - PEA</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{--bg:#0F1117;--card:#171A24;--card2:#1E2230;--line:#2A2F40;--purple:#7C4DFF;--green:#3DDC84;--text:#EDEFF7;--sub:#8A90A6}
  *{box-sizing:border-box}
  body{margin:0;font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  header{padding:24px 20px 12px}
  .brand{font-size:12px;letter-spacing:.14em;color:var(--purple);text-transform:uppercase;font-weight:700}
  h1{margin:6px 0 2px;font-size:20px}
  .sub{font-size:13px;color:var(--sub)}
  main{flex:1;padding:20px;display:flex;flex-direction:column;gap:14px}
  .profile{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  .profile img{width:44px;height:44px;border-radius:50%}
  .profile .name{font-weight:700;font-size:14px}
  .profile .sub2{font-size:11px;color:var(--sub)}
  .veh-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:8px;cursor:pointer}
  .veh-item.selected{border-color:var(--purple);background:rgba(124,77,255,.12)}
  .veh-item.taken{border-color:var(--line)}
  .veh-item .plate{font-family:'IBM Plex Mono',monospace;font-weight:800;font-size:16px}
  .veh-item .meta{font-size:11px;color:var(--sub);margin-top:2px}
  #confirmBtn{width:100%;padding:16px;border:none;border-radius:12px;background:var(--purple);color:#fff;font-size:16px;font-weight:700}
  #confirmBtn:disabled{background:var(--card2);color:var(--sub)}
  .success{text-align:center;padding:40px 10px}
  .success .check{width:64px;height:64px;border-radius:50%;background:rgba(61,220,132,.15);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 16px}
  .empty{text-align:center;color:var(--sub);padding:30px 10px;font-size:13px}
</style>
</head>
<body>
<header>
  <div class="brand">PEA · งานประชุม ผจก. กฟภ.</div>
  <h1>ลงทะเบียนคนขับ</h1>
  <div class="sub">เลือกรถ (ทะเบียน) ที่ท่านขับในงานนี้</div>
</header>
<main>
  <div id="profileBox"></div>
  <div class="field" style="margin-bottom:14px">
    <label style="display:block;font-size:12px;color:var(--sub);margin-bottom:6px">เบอร์โทรศัพท์ (สำหรับติดต่อกรณีฉุกเฉิน)</label>
    <input type="tel" id="phoneInput" placeholder="08X-XXX-XXXX" style="width:100%;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:15px;box-sizing:border-box">
  </div>
  <div id="vehicleList"><div class="empty">กำลังโหลดรายการรถ...</div></div>
  <button id="confirmBtn" disabled>ยืนยันลงทะเบียน</button>
</main>

<script>
const LIFF_ID = '2010970537-5Cxu4dQL';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbytt3h9GVgqqQbuOwrxJGQTOn5pe-fKOOW7H_t6wNWlHCbYGZVY8YtIE-Mcj4kVbkcx/exec';

let profile = null;
let selected = null;
let myCurrentVehicleId = null;

async function loadVehicles(){
  const listEl = document.getElementById('vehicleList');
  try{
    const res = await fetch(`${GAS_URL}?action=vehicles`);
    const list = await res.json();
    if(!list.length){ listEl.innerHTML = '<div class="empty">ไม่พบข้อมูลรถ กรุณาติดต่อแอดมิน</div>'; return; }
    listEl.innerHTML = '';
    list.forEach(v=>{
      const isMine = profile && v.driverLineUserId === profile.userId;
      const isTaken = v.driverLineUserId && !isMine;
      if (isMine) { myCurrentVehicleId = v.vehicleId; document.getElementById('phoneInput').value = v.driverPhone || ''; }

      const el = document.createElement('div');
      el.className = 'veh-item' + (isMine ? ' selected' : '') + (isTaken ? ' taken' : '');
      const statusLabel = isMine ? '✅ รถของท่านตอนนี้' : (isTaken ? `ไม่ว่าง (${v.driverName || 'มีคนขับแล้ว'})` : `${v.vehicleType||''} · ${v.seatCapacity||'-'} ที่นั่ง`);
      el.innerHTML = `<div class="plate">${v.licensePlate}</div><div class="meta">${v.vehicleId} · ${statusLabel}</div>`;
      if (isMine) selected = v;
      if (!isTaken) {
        el.addEventListener('click', ()=>{
          document.querySelectorAll('.veh-item').forEach(x=>x.classList.remove('selected'));
          el.classList.add('selected');
          selected = v;
          document.getElementById('confirmBtn').disabled = false;
          document.getElementById('confirmBtn').textContent = (v.vehicleId===myCurrentVehicleId) ? 'ยืนยันลงทะเบียน' : 'ยืนยันเปลี่ยนรถ';
        });
      } else {
        el.style.opacity = '0.45';
        el.style.cursor = 'not-allowed';
      }
      listEl.appendChild(el);
    });
    if (selected) document.getElementById('confirmBtn').disabled = false;
  }catch(err){
    listEl.innerHTML = '<div class="empty">โหลดรายการรถไม่สำเร็จ</div>';
  }
}

document.getElementById('confirmBtn').addEventListener('click', async ()=>{
  if(!selected || !profile) return;
  const phone = document.getElementById('phoneInput').value.trim();
  if(!phone){ alert('กรุณากรอกเบอร์โทรศัพท์ก่อนครับ'); return; }
  const btn = document.getElementById('confirmBtn');
  btn.disabled = true; btn.textContent = 'กำลังลงทะเบียน...';
  try{
    await fetch(GAS_URL, {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ type:'register', vehicleId: selected.vehicleId, userId: profile.userId, driverName: profile.displayName, phone })
    });
    document.querySelector('main').innerHTML = `<div class="success"><div class="check">✓</div><div style="font-weight:700;font-size:16px">ลงทะเบียนสำเร็จ</div><div style="color:var(--sub);font-size:13px;margin-top:6px">รถ ${selected.licensePlate} (${selected.vehicleId})<br>ท่านสามารถปิดหน้านี้แล้วกลับไปที่แชท เปิดเมนู "เริ่มติดตาม" ได้เลย</div></div>`;
  }catch(err){
    btn.disabled = false; btn.textContent = 'ยืนยันลงทะเบียน';
  }
});

async function init(){
  try{
    await liff.init({ liffId: LIFF_ID });
    if(!liff.isLoggedIn()){ liff.login(); return; }
    profile = await liff.getProfile();
    document.getElementById('profileBox').innerHTML = `<div class="profile"><img src="${profile.pictureUrl||''}"><div><div class="name">${profile.displayName}</div><div class="sub2">บัญชี LINE ที่จะผูกกับรถ</div></div></div>`;
  }catch(err){
    document.getElementById('profileBox').innerHTML = `<div class="empty">กรุณาเปิดหน้านี้ผ่านแอป LINE เพื่อดึงข้อมูลบัญชีอัตโนมัติ</div>`;
  }
  await loadVehicles();
}
init();
</script>
</body>
</html>
